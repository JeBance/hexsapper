<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="hex" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a4a6a"/>
      <stop offset="100%" style="stop-color:#2a2a3a"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)" rx="60"/>
  
  <!-- Hexagon pattern -->
  <g transform="translate(256, 256)">
    <!-- Central hexagon -->
    <path d="M0,-80 L69,-40 L69,40 L0,80 L-69,40 L-69,-40 Z" 
          fill="url(#hex)" 
          stroke="#e94560" 
          stroke-width="4"/>
    
    <!-- Surrounding hexagons (partial) -->
    <path d="M100,-60 L150,-30 L150,30 L100,60 L50,30 L50,-30 Z" 
          fill="#3a3a5a" opacity="0.6"/>
    <path d="M-100,-60 L-50,-30 L-50,30 L-100,60 L-150,30 L-150,-30 Z" 
          fill="#3a3a5a" opacity="0.6"/>
    <path d="M0,-140 L50,-110 L50,-50 L0,-20 L-50,-50 L-50,-110 Z" 
          fill="#3a3a5a" opacity="0.6"/>
    <path d="M0,140 L50,110 L50,50 L0,20 L-50,50 L-50,110 Z" 
          fill="#3a3a5a" opacity="0.6"/>
    
    <!-- Mine icon in center -->
    <circle cx="0" cy="0" r="25" fill="#e94560"/>
    <path d="M0,-35 L0,-15 M0,15 L0,35 M-35,0 L-15,0 M15,0 L35,0 
             M-25,-25 L-12,-12 M12,12 L25,25 M-25,25 L-12,12 M12,-12 L25,-25"
          stroke="#e94560" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Title text -->
  <text x="256" y="450" text-anchor="middle" fill="#ffffff" 
        font-family="Arial, sans-serif" font-size="36" font-weight="bold"
        style="text-shadow: 2px 2px 4px rgba(0,0,0,0.5)">HexSapper</text>
</svg>
